name: Release safety checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.2.12
      - name: Run offline trust-boundary tests without API access or permissions
        run: >-
          deno test --no-config --no-remote
          supabase/functions/_shared/nativeBillingRequest.test.ts
          supabase/functions/_shared/nativeBillingResponse.test.ts
          supabase/functions/_shared/nativeEntitlement.test.ts
          supabase/functions/_shared/releaseSafety.test.ts
          supabase/functions/_shared/weeklyAccess.test.ts
          supabase/functions/_shared/nativeRequestLimits.test.ts
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without running package lifecycle scripts
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi
      - run: npx --no-install tsc --noEmit
      - name: Test the actual Expo config loader and every production guard
        run: node --test scripts/release-config.test.cjs
